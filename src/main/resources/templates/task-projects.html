<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Select Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-kanban"></i>
            TaskFlow Pro
        </a>

        <div class="ms-auto">

            <a href="/" class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/projects" class="btn btn-outline-light me-2">
                Projects
            </a>

            <a href="/studio" class="btn btn-success me-2">
                💻 Studio
            </a>

            <a href="/tasks" class="btn btn-outline-light me-2">
                Tasks
            </a>

            <a href="/logout" class="btn btn-light">
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">
        Select a Project
    </h2>

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="project : ${projects}">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4 th:text="${project.name}"></h4>

                    <p class="text-muted"
                       th:text="${project.description}"></p>

                    <p>

                        <strong>Owner:</strong>

                        <span th:text="${project.owner}"></span>

                    </p>

                    <a th:href="@{'/tasks/' + ${project.id}}"
                       class="btn btn-primary w-100">

                        📋 Open Tasks

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
