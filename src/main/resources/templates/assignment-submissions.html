<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assignment Submissions | TaskFlow Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <a th:href="@{/assignments/{id}(id=${assignment.id})}"
       class="btn btn-outline-secondary mb-4">

        ← Back to Assignment

    </a>


    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>
                Assignment Submissions
            </h2>

            <p class="text-muted mb-0">

                <strong th:text="${assignment.title}">
                    Assignment Title
                </strong>

            </p>

        </div>

        <span class="badge bg-primary"
              th:text="${#lists.size(submissions)} + ' Submission(s)'">

            0 Submissions

        </span>

    </div>


    <!-- No submissions -->

    <div th:if="${#lists.isEmpty(submissions)}"
         class="alert alert-info">

        No students have submitted this assignment yet.

    </div>


    <!-- Submission table -->

    <div th:unless="${#lists.isEmpty(submissions)}"
         class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                    <tr>

                        <th>#</th>

                        <th>Student</th>

                        <th>Email</th>

                        <th>Status</th>

                        <th>Submitted At</th>

                        <th>Marks</th>

                        <th>Action</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="submission, stat : ${submissions}">

                        <td th:text="${stat.count}">
                            1
                        </td>


                        <td>

                            <strong
                                    th:text="${submission.studentName}">
                                Student Name
                            </strong>

                        </td>


                        <td th:text="${submission.studentEmail}">
                            student@example.com
                        </td>


                        <td>

                            <span class="badge bg-success"
                                  th:text="${submission.status}">
                                SUBMITTED
                            </span>

                        </td>


                        <td th:text="${submission.submittedAt}">
                            2026-09-20
                        </td>


                        <td>

                            <span th:if="${submission.marks != null}"
                                  th:text="${submission.marks}">
                                0
                            </span>

                            <span th:unless="${submission.marks != null}"
                                  class="text-muted">
                                Not graded
                            </span>

                        </td>


                        <td>

                            <!-- VIEW SUBMISSION -->

                            <a th:href="@{/assignments/submissions/{id}(id=${submission.id})}"
                               class="btn btn-sm btn-primary">

                                View

                            </a>


                            <!-- DOWNLOAD FILE -->

                            <a th:if="${submission.fileName != null}"
                               th:href="@{/assignments/submissions/{id}/download(id=${submission.id})}"
                               class="btn btn-sm btn-outline-success ms-1">

                                Download

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
