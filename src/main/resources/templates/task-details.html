
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Task Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">📋 TaskFlow Pro</a>

        <div>
            <a class="btn btn-outline-light me-2" th:href="@{/}">Dashboard</a>
            <a class="btn btn-light" th:href="@{/projects}">Projects</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Task Details</h3>
        </div>

        <div class="card-body">

            <h4 th:text="${task.title}"></h4>

            <hr>

            <p>
                <strong>Description :</strong>
                <span th:text="${task.description}"></span>
            </p>

            <p>
                <strong>Status :</strong>
                <span class="badge bg-success"
                      th:text="${task.status}">
                </span>
            </p>

            <p>
                <strong>Priority :</strong>
                <span class="badge bg-danger"
                      th:text="${task.priority}">
                </span>
            </p>

            <p>
                <strong>Assigned To :</strong>

                <span th:if="${task.assignedUser!=null}"
                      th:text="${task.assignedUser.fullName}">
                </span>

                <span th:if="${task.assignedUser==null}">
                    Not Assigned
                </span>

            </p>

        </div>

    </div>

    <br>

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h4>Discussion</h4>
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(comments)}">

                <p class="text-muted">
                    No comments yet.
                </p>

            </div>

            <div th:each="comment : ${comments}"
                 class="border rounded p-3 mb-3">

                <h6>

                    👤

                    <span th:text="${comment.user.fullName}">
                    </span>

                </h6>

                <p th:text="${comment.message}"></p>

            </div>

            <hr>

            <form th:action="@{'/comments/save/' + ${task.id}}"
                  th:object="${comment}"
                  method="post">

                <label class="form-label">
                    Add Comment
                </label>

                <textarea class="form-control"
                          rows="4"
                          th:field="*{message}"
                          required>
                </textarea>

                <br>

                <button class="btn btn-primary">

                    Add Comment

                </button>

            </form>

        </div>

    </div>

    <br>

    <a class="btn btn-secondary"
       th:href="@{'/tasks/' + ${task.project.id}}">

        ← Back to Tasks

    </a>

</div>

</body>
</html>
