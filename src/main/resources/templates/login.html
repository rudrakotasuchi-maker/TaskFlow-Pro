<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    ```
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | TaskFlow Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            background:
                    radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.25), transparent 35%),
                    radial-gradient(circle at 85% 80%, rgba(124, 58, 237, 0.25), transparent 35%),
                    linear-gradient(135deg, #071426, #0b1f3a 55%, #111827);

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.12);
            filter: blur(80px);
            top: -180px;
            left: -150px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.12);
            filter: blur(80px);
            bottom: -180px;
            right: -140px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: linear-gradient(135deg, #2563eb, #7c3aed);

            box-shadow:
                    0 12px 30px rgba(37, 99, 235, 0.35);

            font-size: 29px;
        }

        .brand h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand p {
            margin: 7px 0 0;
            color: #a9b8cc;
            font-size: 14px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 22px;

            box-shadow:
                    0 25px 70px rgba(0, 0, 0, 0.35);

            overflow: hidden;
        }

        .login-card-body {
            padding: 34px;
        }

        .welcome-title {
            color: #111827;
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .welcome-text {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 26px;
        }

        .form-label {
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }

        .form-label i {
            color: #2563eb;
            margin-right: 5px;
        }

        .form-control {
            min-height: 48px;
            border-radius: 11px;
            border: 1px solid #d7dce5;
            padding-left: 14px;
        }

        .form-control:focus {
            border-color: #2563eb;

            box-shadow:
                    0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        .login-btn {
            min-height: 49px;
            border: none;
            border-radius: 11px;

            background: linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
            );

            font-weight: 600;
            font-size: 16px;

            box-shadow:
                    0 8px 18px rgba(37, 99, 235, 0.25);

            transition: all 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 12px 24px rgba(37, 99, 235, 0.32);
        }

        .login-divider {
            border-top: 1px solid #e5e7eb;
            margin: 25px 0 20px;
        }

        .register-text {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin: 0;
        }

        .register-text a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            color: #718096;
            font-size: 12px;
            margin-top: 18px;
        }

        @media (max-width: 480px) {

            .login-wrapper {
                padding: 15px;
            }

            .login-card-body {
                padding: 27px 22px;
            }

        }

    </style>
    ```

</head>

<body>

<div class="login-wrapper">

    ```
    <!-- BRAND -->

    <div class="brand">

        <div class="brand-icon">

            <i class="bi bi-kanban"></i>

        </div>

        <h1>TaskFlow Pro</h1>

        <p>
            Collaborative Project Management Platform
        </p>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

        <div class="login-card-body">

            <div class="welcome-title">
                Welcome back 👋
            </div>

            <div class="welcome-text">
                Sign in to continue to your workspace.
            </div>


            <form th:action="@{/login}"
                  method="post">

                <!-- EMAIL -->

                <div class="mb-3">

                    <label class="form-label">

                        <i class="bi bi-envelope"></i>

                        Email

                    </label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter your email"
                           autocomplete="username"
                           required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-4">

                    <label class="form-label">

                        <i class="bi bi-lock"></i>

                        Password

                    </label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>

                </div>


                <!-- LOGIN -->

                <button type="submit"
                        class="btn btn-primary w-100 login-btn">

                    <i class="bi bi-box-arrow-in-right me-1"></i>

                    Sign In

                </button>

            </form>


            <div class="login-divider"></div>


            <p class="register-text">

                Don't have an account?

                <a th:href="@{/auth/register}">
                    Create an account
                </a>

            </p>

        </div>

    </div>


    <div class="footer-text">

        TaskFlow Pro • Build. Collaborate. Deliver.

    </div>
    ```

</div>

</body>

</html>
