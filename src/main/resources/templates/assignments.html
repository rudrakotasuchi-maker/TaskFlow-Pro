<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assignments | TaskFlow Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Assignment Portal</h2>

        <a th:if="${currentRole == 'ROLE_FACULTY'
          or currentRole == 'ROLE_ADMIN'}"
           th:href="@{/assignments/create}"
           class="btn btn-primary">
            + Create Assignment
        </a>

    </div>


    <div th:if="${#lists.isEmpty(assignments)}"
         class="alert alert-info">

        No assignments available.

    </div>


    <div class="row g-4">

        <div class="col-md-6"
             th:each="assignment : ${assignments}">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${assignment.title}">
                        Assignment Title
                    </h5>

                    <p class="text-primary"
                       th:text="${assignment.subject}">
                        Subject
                    </p>

                    <p class="card-text"
                       th:text="${assignment.description}">
                        Description
                    </p>

                    <p>

                        <strong>Due Date:</strong>

                        <span th:text="${assignment.dueDate}">
                            2026-09-30
                        </span>

                    </p>

                    <a th:href="@{/assignments/{id}(id=${assignment.id})}"
                       class="btn btn-outline-primary">

                        View Assignment

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
