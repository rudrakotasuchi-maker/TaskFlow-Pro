<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Academic Profile | TaskFlow Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            background: #f5f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172b4d;
        }

        .top-navbar {
            background: linear-gradient(135deg, #0d6efd, #2563eb);
            padding: 14px 0;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .navbar-brand {
            color: white !important;
            font-size: 22px;
        }

        .profile-container {
            max-width: 900px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .profile-header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 22px;
        }

        .profile-header i {
            font-size: 40px;
        }

        .profile-header h1 {
            margin: 10px 0 5px;
            font-size: 28px;
        }

        .profile-header p {
            margin: 0;
            opacity: 0.85;
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 6px 22px rgba(31,56,100,0.08);
        }

        .profile-item {
            background: #f8faff;
            border: 1px solid #edf1f7;
            border-radius: 12px;
            padding: 16px;
            height: 100%;
        }

        .profile-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .profile-value {
            color: #172b4d;
            font-size: 16px;
            font-weight: 600;
            word-break: break-word;
        }

        .back-btn {
            border-radius: 9px;
            margin-top: 22px;
        }

    </style>

</head>

<body>

<nav class="top-navbar">

    <div class="container d-flex align-items-center">

        <a class="navbar-brand fw-bold"
           href="/">

            <i class="bi bi-kanban me-2"></i>

            TaskFlow Pro

        </a>

        <div class="ms-auto">

            <a href="/"
               class="btn btn-outline-light">

                <i class="bi bi-house me-1"></i>

                Dashboard

            </a>

        </div>

    </div>

</nav>


<main class="profile-container">

    <div class="profile-header">

        <i class="bi bi-mortarboard-fill"></i>

        <h1>Academic Profile</h1>

        <p>Your academic information</p>

    </div>


    <div class="profile-card">

        <div class="row g-3">

            <!-- FULL NAME -->

            <div class="col-md-6">

                <div class="profile-item">

                    <div class="profile-label">
                        Full Name
                    </div>

                    <div class="profile-value"
                         th:text="${user.fullName}">
                    </div>

                </div>

            </div>


            <!-- REGISTER NUMBER -->

            <div class="col-md-6">

                <div class="profile-item">

                    <div class="profile-label">
                        Register Number
                    </div>

                    <div class="profile-value"
                         th:text="${user.registerNumber}">
                    </div>

                </div>

            </div>


            <!-- EMAIL -->

            <div class="col-md-6">

                <div class="profile-item">

                    <div class="profile-label">
                        Email
                    </div>

                    <div class="profile-value"
                         th:text="${user.email}">
                    </div>

                </div>

            </div>


            <!-- BRANCH -->

            <div class="col-md-6">

                <div class="profile-item">

                    <div class="profile-label">
                        Branch
                    </div>

                    <div class="profile-value"
                         th:text="${user.branch}">
                    </div>

                </div>

            </div>


            <!-- YEAR -->

            <div class="col-md-6">

                <div class="profile-item">

                    <div class="profile-label">
                        Year
                    </div>

                    <div class="profile-value"
                         th:text="${user.year}">
                    </div>

                </div>

            </div>


            <!-- SECTION -->

            <div class="col-md-6">

                <div class="profile-item">

                    <div class="profile-label">
                        Section
                    </div>

                    <div class="profile-value"
                         th:text="${user.section}">
                    </div>

                </div>

            </div>

        </div>


        <a href="/"
           class="btn btn-primary back-btn">

            <i class="bi bi-arrow-left me-1"></i>

            Back to Dashboard

        </a>

    </div>

</main>

</body>

</html>
