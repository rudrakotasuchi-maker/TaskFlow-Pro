<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Submission | TaskFlow Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


</head>

<body>

<div class="container mt-5">

    <a th:href="@{/assignments/{id}(id=${assignment.id})}"
       class="btn btn-outline-secondary mb-4">

        ← Back to Assignment

    </a>


    <div class="card shadow-sm">

        <div class="card-body">

            <h2>My Submission</h2>

            <p class="text-muted"
               th:text="${assignment.title}">
                Assignment Title
            </p>

            <hr>


            <!-- NO SUBMISSION -->

            <div th:if="${submission == null}"
                 class="alert alert-warning">

                You have not submitted this assignment yet.

                <div class="mt-3">

                    <a th:href="@{/assignments/{id}/submit(id=${assignment.id})}"
                       class="btn btn-primary">

                        Submit Assignment

                    </a>

                </div>

            </div>


            <!-- SUBMISSION EXISTS -->

            <div th:if="${submission != null}">


                <!-- STATUS -->

                <div class="mb-4">

                    <h5>Status</h5>

                    <span th:if="${submission.status == 'GRADED'}"
                          class="badge bg-success">

                    GRADED

                </span>

                    <span th:unless="${submission.status == 'GRADED'}"
                          class="badge bg-primary"
                          th:text="${submission.status}">

                    SUBMITTED

                </span>

                </div>


                <!-- SUBMITTED TIME -->

                <div class="mb-4">

                    <strong>Submitted At</strong>

                    <p class="text-muted"
                       th:text="${submission.submittedAt}">

                        Submission Date

                    </p>

                </div>


                <!-- ANSWER -->

                <div class="mb-4">

                    <h5>My Answer</h5>

                    <div class="border rounded p-3 bg-light"
                         style="white-space: pre-wrap;"
                         th:text="${submission.answer}">

                        Student Answer

                    </div>

                </div>


                <hr>


                <!-- RESULT -->

                <h5>Evaluation Result</h5>


                <div class="row mt-3">


                    <!-- MARKS -->

                    <div class="col-md-6 mb-3">

                        <div class="border rounded p-3">

                            <strong>Marks</strong>

                            <div class="mt-2">

                            <span th:if="${submission.marks != null}"
                                  class="fs-4 fw-bold text-success"
                                  th:text="${submission.marks}">

                                0

                            </span>

                                <span th:unless="${submission.marks != null}"
                                      class="text-muted">

                                Not graded yet

                            </span>

                            </div>

                        </div>

                    </div>


                    <!-- FEEDBACK -->

                    <div class="col-md-6 mb-3">

                        <div class="border rounded p-3">

                            <strong>Faculty Feedback</strong>

                            <p class="mt-2 mb-0"
                               th:if="${submission.feedback != null}"
                               th:text="${submission.feedback}">

                                Faculty feedback

                            </p>

                            <p class="mt-2 mb-0 text-muted"
                               th:unless="${submission.feedback != null}">

                                No feedback yet.

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


</div>

</body>

</html>
