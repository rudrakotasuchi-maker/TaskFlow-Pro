<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Evaluate Submission | TaskFlow Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


</head>

<body>

<div class="container mt-5">


    <a th:href="@{/assignments/submissions/{id}(id=${submission.id})}"
       class="btn btn-outline-secondary mb-4">

        ← Back to Submission

    </a>


    <div class="card shadow-sm">

        <div class="card-body">

            <h2>Evaluate Submission</h2>

            <p class="text-muted"
               th:text="${assignment.title}">
                Assignment Title
            </p>

            <hr>


            <!-- STUDENT -->

            <h5>Student</h5>

            <p>
                <strong th:text="${submission.studentName}">
                    Student Name
                </strong>
                <br>

                <span th:text="${submission.studentEmail}">
                student@example.com
            </span>
            </p>


            <!-- ANSWER -->

            <h5 class="mt-4">Student Answer</h5>

            <div class="border rounded p-3 bg-light"
                 style="white-space: pre-wrap;"
                 th:text="${submission.answer}">

                Student Answer

            </div>


            <!-- EVALUATION FORM -->

            <form th:action="@{/assignments/submissions/{id}/evaluate(id=${submission.id})}"
                  method="post"
                  class="mt-4">

                <div class="mb-3">

                    <label class="form-label">
                        Marks
                    </label>

                    <input type="number"
                           name="marks"
                           class="form-control"
                           min="0"
                           max="100"
                           th:value="${submission.marks}"
                           placeholder="Enter marks"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Feedback
                    </label>

                    <textarea name="feedback"
                              class="form-control"
                              rows="5"
                              placeholder="Write feedback for the student..."
                              th:text="${submission.feedback}"></textarea>

                </div>


                <button type="submit"
                        class="btn btn-success">

                    Save Evaluation

                </button>

                <a th:href="@{/assignments/submissions/{id}(id=${submission.id})}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>


</div>

</body>

</html>
