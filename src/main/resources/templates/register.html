```html
<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | TaskFlow Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            background:
                    radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.25), transparent 35%),
                    radial-gradient(circle at 85% 80%, rgba(124, 58, 237, 0.25), transparent 35%),
                    linear-gradient(135deg, #071426, #0b1f3a 55%, #111827);

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: rgba(37, 99, 235, 0.12);

            filter: blur(80px);

            top: -180px;
            left: -150px;
        }

        body::after {
            content: "";
            position: absolute;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(124, 58, 237, 0.12);

            filter: blur(80px);

            bottom: -180px;
            right: -140px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 20px;

            position: relative;
            z-index: 2;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 22px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background: linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
            );

            box-shadow:
                    0 12px 30px rgba(37, 99, 235, 0.35);

            font-size: 28px;
        }

        .brand h1 {
            margin: 0;
            font-size: 29px;
            font-weight: 700;
        }

        .brand p {
            color: #a9b8cc;
            font-size: 14px;
            margin: 6px 0 0;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.97);

            border: 1px solid rgba(255, 255, 255, 0.5);

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                    0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .card-top {
            padding: 25px 30px;

            background:
                    linear-gradient(
                            135deg,
                            #2563eb,
                            #4f46e5,
                            #7c3aed
                    );

            color: white;
        }

        .card-top h2 {
            margin: 0;
            font-size: 23px;
            font-weight: 650;
        }

        .card-top p {
            margin: 6px 0 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
        }

        .card-body {
            padding: 28px 30px;
        }

        .form-label {
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }

        .form-label i {
            color: #2563eb;
            margin-right: 5px;
        }

        .form-control,
        .form-select {
            min-height: 47px;

            border-radius: 10px;

            border: 1px solid #d7dce5;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2563eb;

            box-shadow:
                    0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        .register-btn {
            min-height: 49px;

            border: none;

            border-radius: 10px;

            background:
                    linear-gradient(
                            135deg,
                            #2563eb,
                            #4f46e5
                    );

            font-size: 16px;
            font-weight: 600;

            box-shadow:
                    0 8px 18px rgba(37, 99, 235, 0.25);

            transition: all 0.2s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 12px 24px rgba(37, 99, 235, 0.32);
        }

        .login-text {
            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin: 21px 0 0;
        }

        .login-text a {
            color: #2563eb;

            font-weight: 600;

            text-decoration: none;

            margin-left: 4px;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;

            color: #718096;

            font-size: 12px;

            margin-top: 17px;
        }

        .role-info {
            background: #f3f6ff;
            border-left: 4px solid #2563eb;

            padding: 10px 12px;

            border-radius: 8px;

            font-size: 13px;

            color: #4b5563;

            margin-bottom: 18px;
        }

        @media (max-width: 500px) {

            .register-wrapper {
                padding: 15px;
            }

            .card-body {
                padding: 24px 21px;
            }

            .card-top {
                padding: 22px;
            }

        }

    </style>

</head>

<body>

<div class="register-wrapper">

    <!-- BRAND -->

    <div class="brand">

        <div class="brand-icon">

            <i class="bi bi-kanban"></i>

        </div>

        <h1>TaskFlow Pro</h1>

        <p>
            Collaborative Project Management Platform
        </p>

    </div>


    <!-- REGISTER CARD -->

    <div class="register-card">

        <div class="card-top">

            <h2>
                Create your account
            </h2>

            <p>
                Choose your role and enter your details.
            </p>

        </div>


        <div class="card-body">

            <form th:action="@{/auth/register}"
                  method="post">

                <!-- ROLE -->

                <div class="mb-3">

                    <label class="form-label">

                        <i class="bi bi-people"></i>

                        Role

                    </label>

                    <select id="role"
                            name="role"
                            class="form-select"
                            required>

                        <option value="STUDENT">
                            Student
                        </option>

                        <option value="FACULTY">
                            Faculty
                        </option>

                        <option value="ADMIN">
                            Admin
                        </option>

                    </select>

                </div>


                <!-- ROLE INFORMATION -->

                <div id="roleInfo"
                     class="role-info">

                    Student account: enter your academic details.

                </div>


                <!-- FULL NAME -->

                <div class="mb-3">

                    <label class="form-label">

                        <i class="bi bi-person"></i>

                        Full Name

                    </label>

                    <input type="text"
                           class="form-control"
                           name="fullName"
                           placeholder="Enter your full name"
                           required>

                </div>


                <!-- STUDENT FIELDS -->

                <div id="studentFields">


                    <!-- REGISTER NUMBER -->

                    <div class="mb-3">

                        <label class="form-label">

                            <i class="bi bi-card-text"></i>

                            Register Number

                        </label>

                        <input type="text"
                               id="registerNumber"
                               class="form-control"
                               name="registerNumber"
                               placeholder="Enter your register number">

                    </div>


                    <!-- BRANCH -->

                    <div class="mb-3">

                        <label class="form-label">

                            <i class="bi bi-mortarboard"></i>

                            Branch

                        </label>

                        <input type="text"
                               id="branch"
                               class="form-control"
                               name="branch"
                               placeholder="Example: AI & DS">

                    </div>


                    <!-- YEAR -->

                    <div class="mb-3">

                        <label class="form-label">

                            <i class="bi bi-calendar3"></i>

                            Year

                        </label>

                        <select id="year"
                                name="year"
                                class="form-select">

                            <option value="">
                                Select Year
                            </option>

                            <option value="I B.Tech">
                                I B.Tech
                            </option>

                            <option value="II B.Tech">
                                II B.Tech
                            </option>

                            <option value="III B.Tech">
                                III B.Tech
                            </option>

                            <option value="IV B.Tech">
                                IV B.Tech
                            </option>

                        </select>

                    </div>


                    <!-- SECTION -->

                    <div class="mb-3">

                        <label class="form-label">

                            <i class="bi bi-people"></i>

                            Section

                        </label>

                        <input type="text"
                               id="section"
                               class="form-control"
                               name="section"
                               placeholder="Example: A">

                    </div>

                </div>


                <!-- FACULTY FIELD -->

                <div id="facultyFields"
                     style="display: none;">

                    <div class="mb-3">

                        <label class="form-label">

                            <i class="bi bi-building"></i>

                            Department

                        </label>

                        <input type="text"
                               id="department"
                               class="form-control"
                               name="department"
                               placeholder="Example: AI & DS">

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label class="form-label">

                        <i class="bi bi-envelope"></i>

                        Email

                    </label>

                    <input type="email"
                           class="form-control"
                           name="email"
                           placeholder="you@example.com"
                           required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">

                        <i class="bi bi-lock"></i>

                        Password

                    </label>

                    <input type="password"
                           class="form-control"
                           name="password"
                           placeholder="Create a password"
                           required>

                </div>


                <!-- REGISTER BUTTON -->

                <button type="submit"
                        class="btn btn-primary w-100 register-btn">

                    <i class="bi bi-person-plus me-1"></i>

                    Create Account

                </button>

            </form>


            <!-- LOGIN -->

            <p class="login-text">

                Already have an account?

                <a th:href="@{/auth/login}">
                    Sign in
                </a>

            </p>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer-text">

        TaskFlow Pro • Build. Collaborate. Deliver.

    </div>

</div>


<!-- ROLE SWITCHING SCRIPT -->

<script>

    const roleSelect =
        document.getElementById("role");

    const studentFields =
        document.getElementById("studentFields");

    const facultyFields =
        document.getElementById("facultyFields");

    const roleInfo =
        document.getElementById("roleInfo");


    const registerNumber =
        document.getElementById("registerNumber");

    const branch =
        document.getElementById("branch");

    const year =
        document.getElementById("year");

    const section =
        document.getElementById("section");

    const department =
        document.getElementById("department");


    function updateRoleFields() {

        const role = roleSelect.value;


        if (role === "STUDENT") {

            studentFields.style.display = "block";

            facultyFields.style.display = "none";

            registerNumber.required = true;

            branch.required = true;

            year.required = true;

            section.required = true;

            department.required = false;

            roleInfo.innerText =
                "Student account: enter your academic details.";

        }

        else if (role === "FACULTY") {

            studentFields.style.display = "none";

            facultyFields.style.display = "block";

            registerNumber.required = false;

            branch.required = false;

            year.required = false;

            section.required = false;

            department.required = true;

            roleInfo.innerText =
                "Faculty account: enter your department.";

        }

        else {

            studentFields.style.display = "none";

            facultyFields.style.display = "none";

            registerNumber.required = false;

            branch.required = false;

            year.required = false;

            section.required = false;

            department.required = false;

            roleInfo.innerText =
                "Admin account: enter your basic account details.";

        }

    }


    roleSelect.addEventListener(
        "change",
        updateRoleFields
    );


    updateRoleFields();

</script>

</body>

</html>
