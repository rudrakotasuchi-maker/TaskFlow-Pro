
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Project Tasks</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">📋 TaskFlow Pro</a>

        <div class="ms-auto">

            <a href="/" class="btn btn-outline-light me-2">
                <i class="bi bi-house"></i>
                Dashboard
            </a>

            <a href="/projects" class="btn btn-outline-light me-2">
                <i class="bi bi-folder"></i>
                Projects
            </a>

            <a href="/studio" class="btn btn-success me-2">
                <i class="bi bi-code-slash"></i>
                Studio
            </a>

            <a href="/tasks" class="btn btn-outline-light me-2">
                <i class="bi bi-list-check"></i>
                Tasks
            </a>

            <a href="/logout" class="btn btn-light">
                Logout
            </a>

        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Project Tasks</h1>

        <a class="btn btn-primary"
           th:href="@{'/tasks/new/' + ${projectId}}">
            ➕ Create Task
        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-primary">

                <tr>
                    <th>ID</th>
                    <th>Task</th>
                    <th>Description</th>
                    <th>Assigned To</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="task : ${tasks}">

                    <td th:text="${task.id}"></td>

                    <td th:text="${task.title}"></td>

                    <td th:text="${task.description}"></td>

                    <td th:text="${task.assignedUser != null ? task.assignedUser.fullName : 'Not Assigned'}"></td>

                    <td>

                        <span class="badge bg-success"
                              th:if="${task.status=='Completed'}"
                              th:text="${task.status}">
                        </span>

                        <span class="badge bg-warning text-dark"
                              th:if="${task.status=='Pending'}"
                              th:text="${task.status}">
                        </span>

                        <span class="badge bg-info"
                              th:if="${task.status=='In Progress'}"
                              th:text="${task.status}">
                        </span>

                    </td>

                    <td>

                        <span class="badge bg-danger"
                              th:if="${task.priority=='High'}"
                              th:text="${task.priority}">
                        </span>

                        <span class="badge bg-warning text-dark"
                              th:if="${task.priority=='Medium'}"
                              th:text="${task.priority}">
                        </span>

                        <span class="badge bg-secondary"
                              th:if="${task.priority=='Low'}"
                              th:text="${task.priority}">
                        </span>

                    </td>

                    <td>

                        <a class="btn btn-primary btn-sm"
                           th:href="@{'/tasks/view/' + ${task.id}}">
                            View
                        </a>

                        <a class="btn btn-success btn-sm"
                           th:href="@{'/tasks/edit/' + ${task.id}}">
                            Edit
                        </a>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{'/tasks/delete/' + ${task.id} + '/' + ${projectId}}">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
