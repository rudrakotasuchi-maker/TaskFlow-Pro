<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-kanban"></i>
            TaskFlow Pro
        </a>

        <div class="ms-auto">

            <a href="/" class="btn btn-outline-light me-2">
                <i class="bi bi-house"></i>
                Dashboard
            </a>

            <a href="/projects" class="btn btn-outline-light me-2">
                <i class="bi bi-folder"></i>
                Projects
            </a>

            <a href="/studio" class="btn btn-success me-2">
                <i class="bi bi-code-slash"></i>
                Studio
            </a>

            <a href="/tasks" class="btn btn-outline-light me-2">
                <i class="bi bi-list-check"></i>
                Tasks
            </a>

            <a href="/logout" class="btn btn-light">
                Logout
            </a>

        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Projects</h2>

        <a th:href="@{/projects/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i>
            Create Project
        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-primary">

                <tr>
                    <th>ID</th>
                    <th>Project</th>
                    <th>Owner</th>
                    <th>Deadline</th>
                    <th>Progress</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="project : ${projects}">

                    <td th:text="${project.id}"></td>

                    <td>
                        <strong th:text="${project.name}"></strong><br>
                        <small class="text-muted"
                               th:text="${project.description}"></small>
                    </td>

                    <td th:text="${project.owner}"></td>

                    <td th:text="${project.deadline}"></td>

                    <td style="width:220px">

                        <div class="progress">

                            <div class="progress-bar bg-success"
                                 role="progressbar"
                                 th:style="'width:' + ${project.progress} + '%;'"
                                 th:text="${project.progress + '%'}">
                            </div>

                        </div>

                    </td>

                    <td>

                        <a th:href="@{'/tasks/' + ${project.id}}"
                           class="btn btn-sm btn-success">
                            View
                        </a>

                        <a th:href="@{'/projects/edit/' + ${project.id}}"
                           class="btn btn-sm btn-warning">
                            Edit
                        </a>

                        <a th:href="@{'/projects/delete/' + ${project.id}}"
                           class="btn btn-sm btn-danger">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
