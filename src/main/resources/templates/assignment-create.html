<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Assignment | TaskFlow Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">
        Create Assignment
    </h2>


    <form th:action="@{/assignments/save}"
          th:object="${assignment}"
          method="post">


        <div class="mb-3">

            <label class="form-label">
                Assignment Title
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{title}"
                   placeholder="Enter assignment title"
                   required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Subject
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{subject}"
                   placeholder="Enter subject"
                   required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea class="form-control"
                      th:field="*{description}"
                      rows="5"
                      placeholder="Enter assignment instructions"
                      required></textarea>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Due Date
            </label>

            <input type="date"
                   class="form-control"
                   th:field="*{dueDate}"
                   required>

        </div>


        <div class="d-flex gap-2">

            <button type="submit"
                    class="btn btn-primary">

                Publish Assignment

            </button>

            <a href="/assignments"
               class="btn btn-secondary">

                Cancel

            </a>

        </div>

    </form>

</div>

</body>

</html>
