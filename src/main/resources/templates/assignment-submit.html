<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Submit Assignment | TaskFlow Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <a th:href="@{/assignments/{id}(id=${assignment.id})}"
       class="btn btn-outline-secondary mb-4">

        ← Back to Assignment

    </a>


    <div class="card shadow-sm">

        <div class="card-body">

            <h2>
                Submit Assignment
            </h2>

            <hr>


            <h4 th:text="${assignment.title}">
                Assignment Title
            </h4>

            <p class="text-primary"
               th:text="${assignment.subject}">
                Subject
            </p>


            <div class="alert alert-light border mt-3">

                <strong>Instructions:</strong>

                <p class="mb-0 mt-2"
                   th:text="${assignment.description}">
                    Assignment instructions
                </p>

            </div>


            <!-- SUBMISSION FORM -->

            <form th:action="@{/assignments/{id}/submit(id=${assignment.id})}"
                  method="post"
                  enctype="multipart/form-data">


                <!-- TEXT ANSWER -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        Your Answer

                    </label>

                    <textarea name="answer"
                              class="form-control"
                              rows="8"
                              placeholder="Write your assignment answer here..."></textarea>

                    <div class="form-text">

                        You can write your answer here or upload your assignment file below.

                    </div>

                </div>


                <!-- FILE UPLOAD -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        Upload Assignment

                    </label>

                    <input type="file"
                           name="file"
                           class="form-control"
                           accept=".pdf,.doc,.docx,.ppt,.pptx,.zip">

                    <div class="form-text">

                        Accepted formats:
                        PDF, DOC, DOCX, PPT, PPTX, ZIP

                    </div>

                </div>


                <!-- BUTTONS -->

                <button type="submit"
                        class="btn btn-primary">

                    Submit Assignment

                </button>

                <a th:href="@{/assignments/{id}(id=${assignment.id})}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
